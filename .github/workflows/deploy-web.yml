name: Deploy web to GitHub Pages

# Publishes the Angular app after CI passes on main.
# Set the repository variable API_URL (Settings > Secrets and variables > Actions > Variables)
# to the Render API address, for example https://sse-lock-demo-api.onrender.com
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check API_URL is set
        env:
          API_URL: ${{ vars.API_URL }}
        run: test -n "$API_URL" || { echo "::error::Set the API_URL repository variable first"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - name: Point the app at the deployed API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          node -e 'require("fs").writeFileSync("dist/web/browser/config.json", JSON.stringify({ apiUrl: process.env.API_URL }))'
          # Pages has no rewrites; serve the app for unknown paths too.
          cp dist/web/browser/index.html dist/web/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
